name: RUKUS Android
on:
  push:
    branches: [main, 'build/**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate device smoke runner
        run: bash -n qa/run-device-smoke.sh
      - name: Unit tests
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee gradle-debug-unit-test.log
          status=${PIPESTATUS[0]}
          if [[ $status -ne 0 ]]; then
            {
              echo '## Debug unit-test failure tail'
              echo '```text'
              tail -n 160 gradle-debug-unit-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
      - name: Upload debug unit-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-debug-unit-test-diagnostics
          if-no-files-found: error
          path: gradle-debug-unit-test.log
      - name: Android lint
        run: gradle :app:lintDebug --stacktrace
      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-diagnostics
          if-no-files-found: ignore
          path: app/build/reports/lint-results-debug.*
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Build instrumentation test APK
        run: gradle :app:assembleDebugAndroidTest --stacktrace
      - name: Record exact APK provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          app_apk='app/build/outputs/apk/debug/app-debug.apk'
          test_apk='app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk'
          test -s "$app_apk"
          test -s "$test_apk"
          sha256sum "$app_apk" "$test_apk" > build/release-evidence/SHA256SUMS
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "app_apk=$app_apk"
            echo "instrumentation_apk=$test_apk"
            echo "device_smoke_runner=qa/run-device-smoke.sh"
          } > build/release-evidence/build-provenance.txt
          cat build/release-evidence/build-provenance.txt
          cat build/release-evidence/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: RUKUS-executor-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build/release-evidence/SHA256SUMS
            build/release-evidence/build-provenance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RUKUS-device-smoke-test
          path: |
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            qa/run-device-smoke.sh
            build/release-evidence/SHA256SUMS
            build/release-evidence/build-provenance.txt
