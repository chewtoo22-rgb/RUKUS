name: Onboarding State Contract

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/ruckus/agent/onboarding/**'
      - 'app/src/test/java/com/ruckus/agent/onboarding/**'
      - '.github/workflows/onboarding-state-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  onboarding-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run onboarding state regressions
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.ruckus.agent.onboarding.OnboardingStateTest'
