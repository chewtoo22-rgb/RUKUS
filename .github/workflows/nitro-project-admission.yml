name: NITRO Project Admission Contract

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/ruckus/agent/builder/BuilderEngine.kt'
      - 'app/src/main/java/com/ruckus/agent/builder/NitroProjectAdmission.kt'
      - 'app/src/main/java/com/ruckus/agent/builder/ProjectSpec.kt'
      - 'app/src/test/java/com/ruckus/agent/builder/NitroProjectAdmissionTest.kt'
      - '.github/workflows/nitro-project-admission.yml'
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/ruckus/agent/builder/BuilderEngine.kt'
      - 'app/src/main/java/com/ruckus/agent/builder/NitroProjectAdmission.kt'
      - 'app/src/main/java/com/ruckus/agent/builder/ProjectSpec.kt'
      - 'app/src/test/java/com/ruckus/agent/builder/NitroProjectAdmissionTest.kt'
      - '.github/workflows/nitro-project-admission.yml'

permissions:
  contents: read

jobs:
  project-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run focused builder admission regressions
        run: gradle :app:testDebugUnitTest --tests 'com.ruckus.agent.builder.NitroProjectAdmissionTest' --stacktrace
      - name: Enforce pure admission boundary
        shell: bash
        run: |
          set -euo pipefail
          file='app/src/main/java/com/ruckus/agent/builder/NitroProjectAdmission.kt'
          ! grep -Eq 'android\.|androidx\.|ProcessBuilder|Runtime\.getRuntime|Shizuku|AccessibilityService|java\.net|java\.io|kotlin\.io' "$file"
          grep -F 'MAX_FEATURES = 64' "$file"
          grep -F 'duplicate feature declarations are not allowed' "$file"
          grep -F 'NitroProjectAdmission.admit(spec)' app/src/main/java/com/ruckus/agent/builder/BuilderEngine.kt
