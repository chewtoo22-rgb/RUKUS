name: NITRO builder identity contract

on:
  pull_request:
    paths:
      - 'app/src/main/java/com/ruckus/agent/builder/**'
      - 'qa/validate_nitro_builder_identity.py'
      - '.github/workflows/nitro-builder-identity-contract.yml'
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/ruckus/agent/builder/**'
      - 'qa/validate_nitro_builder_identity.py'
      - '.github/workflows/nitro-builder-identity-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate canonical NITRO builder identity
        run: python qa/validate_nitro_builder_identity.py
