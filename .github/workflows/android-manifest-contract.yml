name: Android Manifest Contract

on:
  pull_request:
    paths:
      - 'app/src/main/AndroidManifest.xml'
      - 'qa/android_manifest_contract.py'
      - '.github/workflows/android-manifest-contract.yml'
  push:
    branches: [main]
    paths:
      - 'app/src/main/AndroidManifest.xml'
      - 'qa/android_manifest_contract.py'
      - '.github/workflows/android-manifest-contract.yml'

permissions:
  contents: read

jobs:
  manifest-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate Android manifest contract
        run: python3 qa/android_manifest_contract.py
