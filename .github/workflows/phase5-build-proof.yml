name: Phase 5 Android Build Proof

on:
  push:
    branches:
      - phase-5/end-to-end-proof
  pull_request:
    branches:
      - phase-4/builder-execution

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble RUKUS debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rukus-debug
          path: app/build/outputs/apk/debug/app-debug.apk
