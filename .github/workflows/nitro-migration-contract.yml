name: NITRO Migration Contract

on:
  pull_request:
    paths:
      - 'app/src/main/**'
      - 'qa/nitro_migration_contract.py'
      - '.github/workflows/nitro-migration-contract.yml'
  push:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'qa/nitro_migration_contract.py'
      - '.github/workflows/nitro-migration-contract.yml'

permissions:
  contents: read

jobs:
  migration-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static migration contract
        run: python3 qa/nitro_migration_contract.py
